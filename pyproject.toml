[build-system]
requires = ["setuptools>=80.9", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "vrlbench"
version = "0.1.0"
description = "A unified simulator for agent memory systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{name = "VRL-Bench authors"}]
keywords = ["simulation", "agent memory systems", "language agents", "trial and error", "evaluation"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
runtime = ["openai==2.49.0", "packaging>=24,<27"]
analysis = ["numpy>=1.22.4,<3", "scipy>=1.11,<2"]
dev = ["build>=1.2,<2", "tomli>=2,<3; python_version < '3.11'"]

[project.scripts]
vrlbench = "vrlbench.cli:main"

[project.urls]
Repository = "https://github.com/vrl-bench/vrlbench"
Paper = "https://arxiv.org/abs/2609.12404"
Issues = "https://github.com/vrl-bench/vrlbench/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["vrlbench", "vrlbench.*"]
namespaces = false

[tool.setuptools.package-data]
"vrlbench" = ["requirements/*.txt", "_replay.html"]
"vrlbench.runtime.er" = ["source_prompts/*.txt", "source_prompts/*LICENSE", "source_prompts/THIRD_PARTY_NOTICES"]
"vrlbench.environments" = ["synapse_overlay/LICENSE", "synapse_overlay/synapse/envs/miniwob/*.py"]
